[package]
name = "ledgerlab"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
description = "A double-entry ledger that proves its invariants and says where it stopped agreeing with somebody else's statement."
license = "MIT"
readme = "README.md"
repository = "https://github.com/paoValle/ledgerlab"
keywords = ["ledger", "accounting", "reconciliation", "double-entry", "money"]
categories = ["finance", "development-tools::testing"]

# Two dependencies, both for the file format. Money, the ledger, the audit and the
# reconciliation are written here: a crate that owns the arithmetic cannot delegate it.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The invariants are the product, so they are tested by generation and not only by example.
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# the same allowances as the rest of the portfolio: `unwrap` in a test is fine, and a
# `must_use` suggestion on every getter is noise
unwrap_used = "allow"
expect_used = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
